# Save this file at: .github/workflows/daily-scrape.yml in your repo
#
# Runs the scraper once a day, commits the fresh summary.json back to the
# repo, and GitHub Pages auto-redeploys. Entirely within GitHub's free tier
# (2,000 Actions minutes/month on a free account — this job uses under a
# minute per run).

name: Daily Gorge Wind Scrape

on:
  schedule:
    # 17:05 UTC = 9:05am PST (winter). Cron runs in UTC and does NOT
    # auto-adjust for daylight saving, so during PDT (summer, most of the
    # year) this actually fires at 10:05am Pacific local time — later, not
    # earlier, so if anything it's extra safe margin after both sites post.
    - cron: "5 17 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tesseract (for wind table OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated summary.json
        run: |
          git config user.name "gorge-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add summary.json
          git diff --staged --quiet || git commit -m "Daily wind conditions update"
          git push
